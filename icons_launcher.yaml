# this is for icons_launcher
icons_launcher:
  image_path: "assets/icon.png"
  platforms:
    android:
      enable: true
      adaptive_background_image: "assets/icon.png"
      adaptive_foreground_image: "assets/icon.png"
    ios:
      enable: true
# run flutter pub get / flutter pub run icons_launcher:create
# after each change
